name: Build and Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        run: sudo apt-get update && sudo apt-get install -y qtbase5-dev
      - name: Build launcher
        run: |
          mkdir build && cd build
          qmake ../Sweet-Tea.pro
          make -j2
      - name: Build and run regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir test-build && cd test-build
          qmake ../tests/launch_refresh.pro
          make -j2
          ./tst_launchrefresh
